<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>mlmongo.py catalog</title>
  <style>
    :root {
      --bg: #0b1015;
      --bg2: #111820;
      --panel: #151d26;
      --panel2: #1b2530;
      --text: #f4f7fb;
      --muted: #9cabb9;
      --accent: #00a4dc;
      --accent2: #45c8f4;
      --danger: #ff6b6b;
      --gold: #ffc857;
      --shadow: 0 18px 48px rgba(0, 0, 0, .35);
      --radius: 14px;
      --header-h: 72px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% -20%, #183247 0, #0d151d 34%, var(--bg) 72%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
    }
    button, input, select { font: inherit; }
    button, a { color: inherit; }
    body.modal-open { overflow: hidden; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      height: var(--header-h);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 28px;
      background: linear-gradient(180deg, rgba(8, 13, 18, .98), rgba(8, 13, 18, .9));
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: max-content;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #005b91);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 22px rgba(0, 164, 220, .28);
    }
    .brand-mark::before {
      content: "";
      width: 14px;
      height: 18px;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 18px solid white;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .25));
    }
    .brand h1 {
      font-size: 1.05rem;
      margin: 0;
      font-weight: 700;
      letter-spacing: .01em;
    }
    .search-wrap {
      flex: 1;
      max-width: 680px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      opacity: .65;
      pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      height: 42px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, .08);
      background: #18212b;
      color: var(--text);
      padding: 0 46px 0 42px;
      outline: none;
      transition: .2s;
    }
    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 164, 220, .15);
    }
    .clear-search {
      position: absolute;
      right: 8px;
      top: 6px;
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      opacity: .65;
      display: none;
    }
    .clear-search.show { display: block; }
    .clear-search:hover {
      background: rgba(255, 255, 255, .08);
      opacity: 1;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .2s;
    }
    .icon-btn:hover, .icon-btn.active {
      background: rgba(255, 255, 255, .1);
    }
    .icon-btn svg { width: 21px; height: 21px; }

    .app {
      max-width: 1800px;
      margin: 0 auto;
      padding: 26px 28px 56px;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 18px;
    }
    .hero h2 {
      font-size: clamp(1.55rem, 3vw, 2.3rem);
      margin: 0 0 5px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 18px 0 24px;
    }
    .pill, .select {
      height: 38px;
      border: 1px solid rgba(255, 255, 255, .09);
      background: var(--panel);
      border-radius: 20px;
      color: var(--text);
      padding: 0 14px;
      outline: none;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: .2s;
    }
    .pill:hover, .pill.active {
      background: #22303c;
      border-color: rgba(0, 164, 220, .55);
    }
    .pill .badge {
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--accent);
      font-size: .72rem;
      font-weight: 700;
      padding: 0 6px;
    }
    .toolbar-spacer { flex: 1; }
    .results-count {
      font-size: .92rem;
      color: var(--muted);
    }

    .filter-panel {
      display: none;
      background: rgba(21, 29, 38, .96);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 16px;
      padding: 18px;
      margin: -10px 0 24px;
      box-shadow: var(--shadow);
    }
    .filter-panel.open { display: block; }
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .field label {
      font-size: .75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .field select, .field input {
      height: 40px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .09);
      background: #101820;
      color: var(--text);
      padding: 0 11px;
      outline: none;
    }
    .field input:focus, .field select:focus {
      border-color: var(--accent);
    }
    .tag-checks {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 210px;
      overflow: auto;
      padding: 2px 0;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .85rem;
      color: var(--text);
      cursor: pointer;
    }
    .check input {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
    }
    .filter-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 28px 18px;
    }
    .card {
      min-width: 0;
      cursor: pointer;
      outline: none;
    }
    .poster-wrap {
      position: relative;
      aspect-ratio: 2/3;
      border-radius: var(--radius);
      overflow: hidden;
      background: linear-gradient(145deg, #24323d, #111820);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .28);
      transition: transform .22s ease, box-shadow .22s ease;
    }
    .card:hover .poster-wrap, .card:focus-visible .poster-wrap {
      transform: scale(1.045);
      box-shadow: 0 18px 38px rgba(0, 0, 0, .5);
    }
    .poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity .3s;
    }
    .poster.loaded { opacity: 1; }
    .poster-placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      color: #91a0ae;
      padding: 16px;
      background: linear-gradient(135deg, #273745, #111820);
    }
    .poster-placeholder span {
      font-size: .75rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .poster-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(0, 0, 0, .9));
      opacity: 0;
      transition: .2s;
      display: flex;
      align-items: end;
      padding: 12px;
    }
    .card:hover .poster-overlay, .card:focus-visible .poster-overlay {
      opacity: 1;
    }
    .info-card {
      margin: auto 0 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(10, 16, 22, .82);
      border: 1px solid rgba(255, 255, 255, .2);
      color: #fff;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .02em;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .3);
      transform: translateY(8px);
      transition: transform .2s ease;
    }
    .card:hover .info-card, .card:focus-visible .info-card {
      transform: translateY(0);
    }
    .info-card svg {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .favorite-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 50%;
      border: 0;
      background: rgba(5, 10, 14, .72);
      color: #eef3f7;
      display: grid;
      place-items: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity .2s ease, transform .15s ease;
      z-index: 2;
    }
    .card:hover .favorite-btn, .favorite-btn:focus-visible, .favorite-btn.active {
      opacity: 1;
    }
    .favorite-btn:hover {
      transform: scale(1.06);
      background: rgba(5, 10, 14, .9);
    }
    .favorite-btn.active { color: var(--gold); }
    .favorite-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      fill-opacity: .12;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill-opacity .15s ease;
    }
    .favorite-btn.active svg { fill-opacity: 1; }

    .rating-badge {
      position: absolute;
      left: 8px;
      bottom: 8px;
      background: rgba(0, 0, 0, .76);
      border-radius: 6px;
      padding: 4px 7px;
      font-size: .75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .rating-badge span { color: var(--gold); }
    .personal-badges {
      position: absolute;
      left: 8px;
      top: 8px;
      right: 50px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      z-index: 2;
      pointer-events: none;
    }
    .personal-badge {
      max-width: 100%;
      padding: 4px 7px;
      border-radius: 5px;
      background: rgba(0, 164, 220, .9);
      color: white;
      font-size: .65rem;
      font-weight: 800;
      letter-spacing: .045em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .35);
    }
    .card-title {
      margin: 10px 2px 3px;
      font-size: .93rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-sub {
      margin: 0 2px;
      color: var(--muted);
      font-size: .8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty.show { display: block; }
    .empty h3 {
      color: var(--text);
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    .loader {
      padding: 34px;
      text-align: center;
      color: var(--muted);
    }
    .copy-paths {
      display: none;
      justify-content: center;
      padding: 4px 0 10px;
    }
    .copy-paths.show { display: flex; }
    .copy-paths .pill {
      height: 44px;
      padding: 0 22px;
      font-weight: 600;
      background: rgba(0, 164, 220, .12);
      border-color: rgba(0, 164, 220, .4);
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      background: rgba(0, 0, 0, .78);
      backdrop-filter: blur(14px);
      overflow: auto;
    }
    .modal.open { display: block; }
    .modal-card {
      position: relative;
      max-width: 1180px;
      margin: 42px auto;
      min-height: 650px;
      background: #111922;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .65);
    }
    .modal-bg {
      position: absolute;
      inset: 0 0 auto;
      height: 430px;
      background-size: cover;
      background-position: center 25%;
      filter: blur(22px) saturate(.7);
      transform: scale(1.1);
      opacity: .24;
    }
    .modal-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(17, 25, 34, .1) 0, #111922 430px);
    }
    .modal-content {
      position: relative;
      z-index: 1;
      padding: 54px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 42px;
      align-items: start;
    }
    .modal-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      border-radius: 14px;
      background: #1b2630;
      box-shadow: var(--shadow);
    }
    .modal-poster-frame {
      width: 100%;
      min-width: 0;
      position: relative;
    }
    .modal-poster-frame.has-dup, .poster-wrap.has-dup {
      padding: 5px;
      border-radius: 16px;
      background: repeating-linear-gradient(45deg, #ffc857 0 9px, #0b1015 9px 13px);
    }
    .modal-poster-frame.has-dup .modal-poster, .poster-wrap.has-dup .poster {
      border-radius: 10px;
    }

    .preview-stamp, .flo-stamp {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140%;
      transform: translate(-50%, -50%) rotate(-28deg);
      opacity: .88;
      pointer-events: none;
      color: #fff;
      text-align: center;
      font-size: clamp(17px, 3.2vw, 26px);
      font-weight: 800;
      letter-spacing: .4em;
      text-indent: .4em;
      line-height: 1;
      background: rgba(10, 16, 22, .45);
      border-top: 2px solid rgba(255, 255, 255, .6);
      border-bottom: 2px solid rgba(255, 255, 255, .6);
      padding: 10px 0;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .5));
      backdrop-filter: blur(2px);
    }
    .modal-close {
      position: absolute;
      z-index: 3;
      right: 18px;
      top: 18px;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, .55);
      color: #fff;
      cursor: pointer;
      font-size: 1.5rem;
      transition: background .2s;
    }
    .modal-close:hover { background: rgba(255, 255, 255, .16); }

    .modal-info { padding-top: 130px; }
    .modal-title {
      font-size: clamp(2rem, 5vw, 4.2rem);
      line-height: 1.03;
      margin: 0 0 12px;
      text-shadow: 0 3px 18px rgba(0, 0, 0, .6);
    }
    .modal-original {
      color: #d0d8df;
      margin: -3px 0 14px;
      font-style: italic;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      color: #d8e0e7;
      font-size: .92rem;
      margin-bottom: 18px;
    }
    .meta-dot::before {
      content: "•";
      margin-right: 14px;
      color: #748392;
    }
    .rating-large {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--gold);
      font-weight: 700;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
    }
    .chip {
      background: rgba(255, 255, 255, .09);
      border-radius: 16px;
      padding: 6px 11px;
      font-size: .8rem;
    }
    .overview {
      font-size: 1rem;
      line-height: 1.65;
      color: #dce3e9;
      max-width: 900px;
    }
    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 28px;
      margin-top: 26px;
    }
    .detail h4, .files-block h4 {
      font-size: .74rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin: 0 0 6px;
    }
    .detail p {
      margin: 0;
      line-height: 1.45;
      word-break: break-word;
    }
    .cast-list { color: #c9d4dd; }
    .path-box {
      margin-top: 26px;
      padding: 13px 15px;
      border-radius: 9px;
      background: #0b1219;
      color: #aebbc7;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .79rem;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, .06);
    }
    .files-block { margin-top: 26px; }
    .file-row {
      background: #0b1219;
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .file-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .file-name {
      font-size: .9rem;
      font-weight: 600;
      word-break: break-all;
    }
    .file-path {
      margin-top: 6px;
      color: #aebbc7;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .78rem;
      word-break: break-all;
    }
    .file-meta {
      margin-top: 6px;
      color: #748392;
      font-size: .78rem;
    }
    .external-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }
    .external-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 9px;
      background: rgba(0, 164, 220, .12);
      border: 1px solid rgba(0, 164, 220, .35);
      color: #dff7ff;
      text-decoration: none;
      font-weight: 700;
      font-size: .88rem;
      transition: background .18s, transform .18s;
    }
    .external-link:hover {
      background: rgba(0, 164, 220, .22);
      transform: translateY(-1px);
    }
    .external-link svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      flex: 0 0 auto;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 20px);
      background: #eaf7fc;
      color: #06202a;
      padding: 10px 16px;
      border-radius: 9px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 200;
      box-shadow: var(--shadow);
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 760px) {
      .topbar { padding: 0 14px; gap: 10px; }
      .brand h1 { display: none; }
      .app { padding: 20px 14px 42px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 22px 12px; }
      .toolbar-spacer { display: none; }
      .results-count { width: 100%; order: 2; }
      .modal-card { margin: 0; min-height: 100%; border-radius: 0; }
      .modal-content { grid-template-columns: 110px 1fr; gap: 18px; padding: 70px 18px 28px; }
      .modal-info { padding-top: 30px; }
      .modal-title { font-size: 2rem; }
      .modal-bg { height: 300px; }
      .modal-gradient { background: linear-gradient(180deg, rgba(17, 25, 34, .25), #111922 310px); }
      .details-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <h1>mlmongo.py catalog</h1>
    <a href="https://nstuffed.github.io/">[index]</a>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <input id="search" type="search" placeholder="Cerca film, attori, registi… Usa -termine per escludere" autocomplete="off">
    <button class="clear-search" id="clearSearch" aria-label="Cancella ricerca">×</button>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="favoritesOnly" title="Preferiti" aria-label="Mostra preferiti">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"></path></svg>
    </button>
  </div>
</header>

<main class="app">
  <section class="hero"><div><h2>Catalog</h2></div></section>
  <div class="toolbar">
    <button class="pill" id="filtersToggle">Filtri <span class="badge" id="activeFilters">0</span></button>
    <button class="pill" id="randomPick" title="Scegli un film a caso tra i risultati">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"></circle><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor"></circle><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"></circle></svg>Casuale
    </button>
    <button class="pill" id="dupsOnly" title="Mostra solo i titoli con più di un file collegato">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Duplicati
    </button>
    <select class="select" id="sort">
      <option value="date_desc">Aggiunti di recente</option>
      <option value="title_asc">Titolo A–Z</option>
      <option value="title_desc">Titolo Z–A</option>
      <option value="year_desc">Anno più recente</option>
      <option value="year_asc">Anno meno recente</option>
      <option value="runtime_asc">Durata crescente</option>
      <option value="random">Casuale</option>
    </select>
    <div class="toolbar-spacer"></div>
    <div class="results-count" id="resultsCount"></div>
  </div>

  <section class="filter-panel" id="filterPanel">
    <div class="filter-grid">
      <div class="field"><label for="yearFilter">Anno</label><select id="yearFilter"><option value="">Tutti</option></select></div>
      <div class="field"><label for="directoryFilter">Directory</label><select id="directoryFilter"><option value="">Tutte</option></select></div>
      <div class="field">
        <label>Tags</label>
        <div class="tag-checks" id="tagFilter">
          <label class="check"><input type="checkbox" data-tag="NOSUB"> No subs</label>
          <label class="check"><input type="checkbox" data-tag="millennium"> Millennium (2010+)</label>
          <label class="check"><input type="checkbox" data-tag="modern"> Modern (1990–2009)</label>
          <label class="check"><input type="checkbox" data-tag="eighties"> Eighties (1980–89)</label>
          <label class="check"><input type="checkbox" data-tag="goldies"> Goldies (1960–79)</label>
          <label class="check"><input type="checkbox" data-tag="classics"> Classics (1940–59)</label>
          <label class="check"><input type="checkbox" data-tag="oldies"> Oldies (≤1939)</label>
        </div>
      </div>
      <div class="field"><label for="runtimeFilter">Durata max (min)</label><input id="runtimeFilter" type="number" min="1" step="1" inputmode="numeric" placeholder="es. 95"></div>
    </div>
    <div class="filter-actions"><button class="pill" id="resetFilters">Azzera filtri</button></div>
  </section>

  <section class="grid" id="grid"></section>
  <div class="loader" id="loader"></div>
  <div class="copy-paths" id="copyPathsBar">
    <button class="pill" id="copyPaths" title="Copia i percorsi bash">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      <span id="copyPathsLabel">Copia percorsi</span>
    </button>
  </div>
  <section class="empty" id="empty">
    <h3>Nessun titolo trovato</h3>
    <p>Prova a cambiare ricerca o filtri.</p>
  </section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-bg" id="modalBg"></div>
    <div class="modal-gradient"></div>
    <button class="modal-close" id="modalClose" aria-label="Chiudi">×</button>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- MARKER OBBLIGATORIO PER MLMONGO.PY STANDALONE: NON MODIFICARE QUESTA RIGA -->
<script src="catalog.data"></script>

<script>
'use strict';

/**
 * Decomprime e carica i dati del catalogo dal blob gzip base64 globale.
 */
async function loadCatalogData() {
  const encoded = window.CATALOG_DATA_GZIP_B64;
  if (!encoded) {
    throw new Error('Database compresso non trovato. Verifica che catalog.data sia presente.');
  }
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('Il browser in uso non supporta DecompressionStream nativo (richiesto Chrome 80+, Firefox 113+, Safari 16.4+).');
  }

  const binary = atob(encoded);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const text = await new Response(stream).text();
  return JSON.parse(text);
}

(async () => {
  try {
    const DATA = await loadCatalogData();

    // Helper per LocalStorage sicuro
    const getFavorites = () => {
      try {
        return new Set(JSON.parse(localStorage.getItem('catalogFavorites') || '[]'));
      } catch {
        return new Set();
      }
    };
    const saveFavorites = set => {
      try {
        localStorage.setItem('catalogFavorites', JSON.stringify([...set]));
      } catch {
        /* storage disabilitato o pieno */
      }
    };

    const favorites = getFavorites();
    const state = {
      query: '',
      year: '',
      directory: '',
      runtime: '',
      tags: [],
      sort: 'date_desc',
      favoritesOnly: false,
      dupsOnly: false,
      rendered: 0,
      batch: 60,
      filtered: [],
      modalIndex: -1,
    };

    const $ = id => document.getElementById(id);
    const grid = $('grid'), loader = $('loader'), empty = $('empty'), search = $('search');

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;',
    }[c]));

    const fmtRuntime = n => (n ? `${n} min` : '');
    const getFiles = item => (item.files && item.files.length ? item.files : [item]);
    const hasDuplicates = item => (item.files && item.files.length > 1);
    const itemDirs = item => getFiles(item).map(f => f.directory).filter(Boolean);
    const isFloNico = item => getFiles(item).some(f => String(f.path || '').replace(/\\/g, '/').toLowerCase().startsWith('gtfo/flo_nico'));

    const shownPaths = () => {
      const out = new Set();
      state.filtered.forEach(item => {
        getFiles(item).forEach(f => { if (f.path) out.add(f.path); });
      });
      return [...out];
    };

    const shellQuote = p => "'" + String(p).replace(/'/g, "'\\''") + "'";

    const updateCopyBar = () => {
      const show = state.favoritesOnly && state.filtered.length > 0;
      $('copyPathsBar').classList.toggle('show', show);
      if (show) {
        const n = shownPaths().length;
        $('copyPathsLabel').textContent = `Copia ${n} ${n === 1 ? 'percorso' : 'percorsi'}`;
      }
    };

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch { /* fallback */ }
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch { /* ignore */ }
      ta.remove();
      return ok;
    }

    // Inizializzazione filtri univoci
    const uniqueYears = [...new Set(DATA.map(i => i.year).filter(Boolean))].sort((a, b) => b - a);
    const uniqueDirs = [...new Set(DATA.flatMap(itemDirs))].sort((a, b) => String(a).localeCompare(String(b), 'it', { numeric: true }));

    const fillSelect = (el, values) => {
      values.forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = v;
        el.appendChild(o);
      });
    };
    fillSelect($('yearFilter'), uniqueYears);
    fillSelect($('directoryFilter'), uniqueDirs);

    const updateFilterBadge = () => {
      const count = ['year', 'directory', 'runtime'].filter(k => String(state[k]).trim()).length + state.tags.length;
      $('activeFilters').textContent = count;
    };

    function parseSearchQuery(val) {
      const positive = [];
      const negative = [];
      const tokens = val.toLocaleLowerCase('it').trim().split(/\s+/).filter(Boolean);
      for (const token of tokens) {
        if (token.startsWith('-') && token.length > 1) {
          negative.push(token.slice(1));
        } else {
          positive.push(token);
        }
      }
      return { positive, negative };
    }

    const PRESETS = {
      NOSUB: { exclude: ['subita', 'dualsub', 'engsub', 'multisub', 'aisub', 'itasubbed', 'engsubbed'] },
      millennium: { min: 2010 },
      modern: { min: 1990, max: 2009 },
      eighties: { min: 1980, max: 1989 },
      goldies: { min: 1960, max: 1979 },
      classics: { min: 1940, max: 1959 },
      oldies: { max: 1939 },
    };

    function presetMatches(p, i) {
      if (!p) return true;
      if (p.exclude) return !p.exclude.some(t => i.search && i.search.includes(t));
      const y = i.year;
      return (p.min === undefined || y >= p.min) && (p.max === undefined || y <= p.max);
    }

    // Algoritmo Fisher-Yates per ordinamento casuale non distorto
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function filterData() {
      const { positive, negative } = parseSearchQuery(state.query);
      let arr = DATA.filter(i => {
        if (state.dupsOnly && !hasDuplicates(i)) return false;
        if (positive.some(t => !i.search || !i.search.includes(t))) return false;
        if (negative.some(t => i.search && i.search.includes(t))) return false;
        if (state.year && String(i.year) !== state.year) return false;
        if (state.tags.some(tag => !presetMatches(PRESETS[tag], i))) return false;
        if (state.directory && !itemDirs(i).includes(state.directory)) return false;
        if (state.runtime && (!i.runtime || i.runtime > Number(state.runtime))) return false;
        if (state.favoritesOnly && !favorites.has(i.id)) return false;
        return true;
      });

      if (state.sort === 'title_asc') arr.sort((a, b) => a.title.localeCompare(b.title, 'it'));
      else if (state.sort === 'title_desc') arr.sort((a, b) => b.title.localeCompare(a.title, 'it'));
      else if (state.sort === 'year_desc') arr.sort((a, b) => b.year - a.year || a.title.localeCompare(b.title, 'it'));
      else if (state.sort === 'year_asc') arr.sort((a, b) => a.year - b.year || a.title.localeCompare(b.title, 'it'));
      else if (state.sort === 'runtime_asc') arr.sort((a, b) => (a.runtime || 9999) - (b.runtime || 9999));
      else if (state.sort === 'random') shuffleArray(arr);
      else arr.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      state.filtered = arr;
      state.rendered = 0;
      grid.innerHTML = '';
      empty.classList.toggle('show', arr.length === 0);
      $('resultsCount').textContent = `${arr.length} ${arr.length === 1 ? 'titolo' : 'titoli'}`;
      updateFilterBadge();
      updateCopyBar();
      renderNext();
    }

    function cardHtml(i) {
      const sub = [i.year || '', fmtRuntime(i.runtime)].filter(Boolean).join(' · ');
      const personalBadges = (i.personalTags || []).map(t => `<span class="personal-badge">${esc(t)}</span>`).join('');
      const dup = hasDuplicates(i);
      const isFav = favorites.has(i.id);

      return `<article class="card" tabindex="0" data-id="${esc(i.id)}">
        <div class="poster-wrap${dup ? ' has-dup' : ''}">
          ${i.poster ? `<img class="poster" src="${esc(i.poster)}" alt="Locandina di ${esc(i.title)}" loading="lazy" decoding="async">` : `<div class="poster-placeholder"><span>${esc(i.title)}</span></div>`}
          ${i.preview ? '<span class="preview-stamp" aria-hidden="true">PREVIEW</span>' : ''}
          ${isFloNico(i) ? '<span class="flo-stamp" aria-hidden="true">FLO+NICO</span>' : ''}
          ${personalBadges ? `<div class="personal-badges">${personalBadges}</div>` : ''}
          <button class="favorite-btn ${isFav ? 'active' : ''}" data-fav="${esc(i.id)}" aria-label="Preferito" aria-pressed="${isFav ? 'true' : 'false'}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"></path></svg>
          </button>
          ${i.rating ? `<div class="rating-badge"><span>★</span>${Number(i.rating).toFixed(1)}</div>` : ''}
          <div class="poster-overlay">
            <div class="info-card">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 8h10M7 12h6M7 16h4"></path><circle cx="17" cy="15" r="2.5"></circle><path d="M17 13.8v2.4"></path></svg>
              <span>Dettagli</span>
            </div>
          </div>
        </div>
        <h3 class="card-title">${esc(i.title)}</h3>
        <p class="card-sub">${esc(sub)}</p>
      </article>`;
    }

    function renderNext() {
      if (state.rendered >= state.filtered.length) {
        loader.textContent = state.filtered.length ? 'Fine catalogo' : '';
        return;
      }
      const end = Math.min(state.rendered + state.batch, state.filtered.length);
      const chunk = state.filtered.slice(state.rendered, end);
      grid.insertAdjacentHTML('beforeend', chunk.map(cardHtml).join(''));
      state.rendered = end;
      loader.textContent = state.rendered < state.filtered.length ? 'Scorri per caricare altri titoli' : '';

      grid.querySelectorAll('img.poster:not([data-bound])').forEach(img => {
        img.dataset.bound = '1';
        if (img.complete) {
          img.classList.add('loaded');
        } else {
          img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
          img.addEventListener('error', () => {
            const wrap = img.closest('.poster-wrap');
            if (wrap) {
              const title = wrap.closest('.card')?.querySelector('.card-title')?.textContent || '';
              wrap.insertAdjacentHTML('afterbegin', `<div class="poster-placeholder"><span>${esc(title)}</span></div>`);
            }
            img.remove();
          }, { once: true });
        }
      });
    }

    // Infinite scroll fluido con IntersectionObserver
    const observer = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting && state.rendered < state.filtered.length) {
        renderNext();
      }
    }, { rootMargin: '500px' });
    observer.observe(loader);

    let toastTimer;
    function toast(msg) {
      clearTimeout(toastTimer);
      $('toast').textContent = msg;
      $('toast').classList.add('show');
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
    }

    function toggleFavorite(id, btn) {
      favorites.has(id) ? favorites.delete(id) : favorites.add(id);
      const active = favorites.has(id);
      saveFavorites(favorites);
      btn?.classList.toggle('active', active);
      btn?.setAttribute('aria-pressed', active ? 'true' : 'false');
      toast(active ? 'Aggiunto ai preferiti' : 'Rimosso dai preferiti');
      if (state.favoritesOnly) filterData();
    }

    function externalLinks(i) {
      const id = i.tmdbId, iid = i.imdbId;
      if (/^tt\d+$/i.test(id || '')) {
        return `<div class="external-links"><a class="external-link" href="https://www.imdb.com/title/${encodeURIComponent(id)}/" target="_blank" rel="noopener noreferrer" aria-label="Apri su IMDb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>IMDb</a></div>`;
      }
      let out = (id || iid) ? '<div class="external-links">' : '';
      if (id) {
        out += `<a class="external-link" href="https://www.themoviedb.org/movie/${encodeURIComponent(id)}" target="_blank" rel="noopener noreferrer" aria-label="Apri su TMDB"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>TMDB</a>`;
        out += `<a class="external-link" href="https://letterboxd.com/tmdb/${encodeURIComponent(id)}/" target="_blank" rel="noopener noreferrer" aria-label="Apri su Letterboxd"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/></svg>Letterboxd</a>`;
      }
      if (iid) {
        out += `<a class="external-link" href="https://www.imdb.com/title/${encodeURIComponent(iid)}/" target="_blank" rel="noopener noreferrer" aria-label="Apri su IMDb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>IMDb</a>`;
      }
      return out ? `${out}</div>` : '';
    }

    function openModal(id) {
      const i = DATA.find(x => x.id === id);
      if (!i) return;
      state.modalIndex = state.filtered.findIndex(x => x.id === id);
      const poster = (i.poster && /^https?:\/\//i.test(i.poster)) ? i.poster.replace(/["\\]/g, '') : '';
      const dup = hasDuplicates(i);
      const stampsHtml = `${i.preview ? '<span class="preview-stamp" aria-hidden="true">PREVIEW</span>' : ''}${isFloNico(i) ? '<span class="flo-stamp" aria-hidden="true">FLO+NICO</span>' : ''}`;

      $('modalBg').style.backgroundImage = poster ? `url("${poster}")` : 'none';
      $('modalContent').innerHTML = `
        <div class="modal-poster-frame${dup ? ' has-dup' : ''}">
          ${poster ? `<img class="modal-poster" src="${esc(poster)}" alt="Locandina di ${esc(i.title)}">` : `<div class="modal-poster poster-placeholder"><span>${esc(i.title)}</span></div>`}
          ${stampsHtml}
        </div>
        <section class="modal-info">
          <h2 class="modal-title">${esc(i.title)}</h2>
          ${i.originalTitle && i.originalTitle !== i.title ? `<p class="modal-original">${esc(i.originalTitle)}</p>` : ''}
          <div class="meta-row">
            ${i.rating ? `<span class="rating-large">★ ${Number(i.rating).toFixed(1)}</span>` : ''}
            ${i.year ? `<span class="meta-dot">${esc(i.year)}</span>` : ''}
            ${i.runtime ? `<span class="meta-dot">${esc(fmtRuntime(i.runtime))}</span>` : ''}
            ${i.officialRating ? `<span class="meta-dot">${esc(i.officialRating)}</span>` : ''}
          </div>
          ${(i.genres && i.genres.length) ? `<div class="chips">${i.genres.map(g => `<span class="chip">${esc(g)}</span>`).join('')}</div>` : ''}
          <p class="overview">${i.overview ? esc(i.overview) : 'Nessuna descrizione disponibile.'}</p>
          <div class="details-grid">
            ${i.director ? `<div class="detail"><h4>Regia</h4><p>${esc(i.director)}</p></div>` : ''}
            ${(i.studios && i.studios.length) ? `<div class="detail"><h4>Studio</h4><p>${esc(i.studios.join(', '))}</p></div>` : ''}
            ${(i.cast && i.cast.length) ? `<div class="detail"><h4>Cast</h4><p class="cast-list">${esc(i.cast.join(', '))}</p></div>` : ''}
            ${i.dateDisplay ? `<div class="detail"><h4>Aggiunto</h4><p>${esc(i.dateDisplay)}</p></div>` : ''}
            ${(i.tags && i.tags.length) ? `<div class="detail"><h4>Tag</h4><p>${esc(i.tags.join(', '))}</p></div>` : ''}
          </div>
          ${externalLinks(i)}
          ${(i.files && i.files.length) ? `<div class="files-block"><h4>File disponibili</h4>${i.files.map(f => `
            <div class="file-row">
              <div class="file-head">
                <span class="file-name">${esc(f.fileName)}</span>
                ${(f.personalTags || []).map(t => `<span class="personal-badge">${esc(t)}</span>`).join('')}
              </div>
              <div class="file-path">${esc(f.path)}</div>
              <div class="file-meta">${esc(f.dateDisplay || f.dateAdded || '')}${(f.tags && f.tags.length) ? ` · ${esc(f.tags.join(', '))}` : ''}</div>
            </div>`).join('')}</div>` : (i.path ? `<div class="path-box">${esc(i.path)}</div>` : '')}
        </section>`;

      $('modal').classList.add('open');
      $('modal').setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function navModal(delta) {
      const len = state.filtered.length;
      if (len < 2 || state.modalIndex < 0) return;
      state.modalIndex = (state.modalIndex + delta + len) % len;
      openModal(state.filtered[state.modalIndex].id);
    }

    function closeModal() {
      $('modal').classList.remove('open');
      $('modal').setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
    }

    // Gestione ricerca con debounce
    let debounceTimer;
    search.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      $('clearSearch').classList.toggle('show', search.value.length > 0);
      debounceTimer = setTimeout(() => {
        state.query = search.value.toLocaleLowerCase('it').trim();
        filterData();
      }, 180);
    });

    $('clearSearch').addEventListener('click', () => {
      search.value = '';
      state.query = '';
      $('clearSearch').classList.remove('show');
      filterData();
      search.focus();
    });

    $('filtersToggle').addEventListener('click', () => $('filterPanel').classList.toggle('open'));
    $('sort').addEventListener('change', e => { state.sort = e.target.value; filterData(); });
    $('favoritesOnly').addEventListener('click', e => {
      state.favoritesOnly = !state.favoritesOnly;
      e.currentTarget.classList.toggle('active', state.favoritesOnly);
      filterData();
    });
    $('dupsOnly').addEventListener('click', e => {
      state.dupsOnly = !state.dupsOnly;
      e.currentTarget.classList.toggle('active', state.dupsOnly);
      filterData();
    });

    $('randomPick').addEventListener('click', () => {
      if (!state.filtered.length) {
        toast('Nessun titolo da cui scegliere');
        return;
      }
      openModal(state.filtered[Math.floor(Math.random() * state.filtered.length)].id);
    });

    $('copyPaths').addEventListener('click', async () => {
      const paths = shownPaths();
      if (!paths.length) {
        toast('Nessun percorso da copiare');
        return;
      }
      const ok = await copyText(paths.map(shellQuote).join('\n') + '\n');
      toast(ok ? `${paths.length} ${paths.length === 1 ? 'percorso copiato' : 'percorsi copiati'}` : 'Copia non riuscita');
    });

    [['yearFilter', 'year'], ['directoryFilter', 'directory']].forEach(([id, key]) => {
      $(id).addEventListener('change', e => {
        state[key] = e.target.value;
        filterData();
      });
    });

    $('tagFilter').addEventListener('change', () => {
      state.tags = [...$('tagFilter').querySelectorAll('input:checked')].map(c => c.dataset.tag);
      filterData();
    });

    $('runtimeFilter').addEventListener('input', e => {
      state.runtime = e.target.value;
      filterData();
    });

    function resetAllFilters() {
      search.value = '';
      state.query = '';
      $('clearSearch').classList.remove('show');
      ['yearFilter', 'directoryFilter', 'runtimeFilter'].forEach(id => { $(id).value = ''; });
      $('tagFilter').querySelectorAll('input').forEach(c => { c.checked = false; });
      $('sort').value = 'date_desc';
      Object.assign(state, {
        query: '', year: '', directory: '', runtime: '', tags: [],
        sort: 'date_desc', favoritesOnly: false, dupsOnly: false,
      });
      $('favoritesOnly').classList.remove('active');
      $('dupsOnly').classList.remove('active');
      filterData();
    }
    $('resetFilters').addEventListener('click', resetAllFilters);

    grid.addEventListener('click', e => {
      const fav = e.target.closest('[data-fav]');
      if (fav) {
        e.stopPropagation();
        toggleFavorite(fav.dataset.fav, fav);
        return;
      }
      const card = e.target.closest('.card');
      if (card) openModal(card.dataset.id);
    });

    grid.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) {
        e.preventDefault();
        openModal(e.target.dataset.id);
      }
    });

    $('modalClose').addEventListener('click', closeModal);
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

    document.addEventListener('keydown', e => {
      if (document.body.classList.contains('modal-open')) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault();
          navModal(e.key === 'ArrowRight' ? 1 : -1);
        } else if (e.key === 'Escape') {
          closeModal();
        }
        return;
      }
      if (e.key === 'Escape') {
        resetAllFilters();
        search.focus();
      } else if (e.key === '/' && document.activeElement !== search) {
        e.preventDefault();
        search.focus();
      }
    });

    // Avvio primo render
    filterData();

  } catch (error) {
    console.error(error);
    const loader = document.getElementById('loader');
    const empty = document.getElementById('empty');
    if (loader) loader.textContent = 'Errore caricamento catalogo: ' + error.message;
    if (empty) empty.classList.remove('show');
  }
})();
</script>
</body>
</html>
