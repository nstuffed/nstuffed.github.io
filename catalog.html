.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:28px 18px}.card{min-width:0;cursor:pointer;outline:none}.poster-wrap{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:linear-gradient(145deg,#24323d,#111820);box-shadow:0 10px 26px rgba(0,0,0,.28);transition:transform .22s ease,box-shadow .22s ease}.card:hover .poster-wrap,.card:focus-visible .poster-wrap{transform:scale(1.045);box-shadow:0 18px 38px rgba(0,0,0,.5)}.poster{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}.poster.loaded{opacity:1}.poster-placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#91a0ae;padding:16px;background:linear-gradient(135deg,#273745,#111820)}.poster-placeholder span{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase}.poster-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.9));opacity:0;transition:.2s;display:flex;align-items:end;padding:12px}.card:hover .poster-overlay,.card:focus-visible .poster-overlay{opacity:1}.info-card{margin:auto 0 0;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:9px;background:rgba(10,16,22,.82);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:.82rem;font-weight:700;letter-spacing:.02em;backdrop-filter:blur(8px);box-shadow:0 8px 22px rgba(0,0,0,.3);transform:translateY(8px);transition:transform .2s ease,background-color .2s ease,border-color .2s ease}.card:hover .info-card,.card:focus-visible .info-card{transform:translateY(0)}.info-card svg{width:18px;height:18px;flex:0 0 18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.favorite-btn{position:absolute;top:8px;right:8px;width:34px;height:34px;min-width:34px;min-height:34px;padding:0;flex:0 0 34px;aspect-ratio:1;border-radius:50%;border:0;background:rgba(5,10,14,.72);color:#eef3f7;display:g .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#eaf7fc;color:#06202a;padding:10px 16px;border-radius:9px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark"></div><h1>mlmongo.py catalog</h1><a href="https://nstuffed.github.io/">[index]</a></div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <input id="search" type="search" placeholder="Cerca film, attori, registi… Usa -termine per escludere" autocomplete="off">
    <button class="clear-search" id="clearSearch" aria-label="Cancella ricerca">×</button>
  </div>
  <div class="header-actions">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"></path></svg>
    </button>
  </div>
</header>
<main class="app">
  <section class="hero"><div><h2>Catalog</h2></div></section>
  <div class="toolbar">
    <button class="pill" id="filtersToggle">Filtri <span class="badge" id="activeFilters">0</span></button>
    <button class="pill" id="randomPick" title="Scegli un film a caso tra i risultati"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"></circle><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"></circle></svg>Casuale</button>
    <button class="pill" id="dupsOnly" title="Mostra solo i titoli con più di un file collegato (ignora gli altri filtri)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Duplicati</button>
    <select class="select" id="sort">
      <option value="date_desc">Aggiunti di recente</option><option value="title_asc">Titolo A–Z</option>
      <option value="title_desc">Titolo Z–A</option><option value="year_desc">Anno più recente</option>
      <option value="year_asc">Anno meno recente</option>
      <option value="runtime_asc">Durata crescente</option><option value="random">Casuale</option>

      <div class="field"><label for="tagFilter">Tags</label><div class="tag-checks" id="tagFilter"><label class="check"><input type="checkbox" data-tag="NOSUB"> No subs</label><label class="check"><input type="checkbox" data-tag="millennium"> Millennium (2010+)</label><label class="check"><input type="checkbox" data-tag="modern"> Modern (1990–2009)</label><label class="check"><input type="checkbox" data-tag="eighties"> Eighties (1980–89)</label><label class="check"><input type="checkbox" data-tag="goldies"> Goldies (1960–79)</label><label class="check"><input type="checkbox" data-tag="classics"> Classics (1940–59)</label><label class="check"><input type="checkbox" data-tag="oldies"> Oldies (≤1939)</label></div></div>

<script>
'use strict';
async function loadCatalogData(){
  const encoded=window.CATALOG_DATA_GZIP_B64;
  if(!encoded)throw new Error('Database compresso non trovato. Verifica che catalog.data sia accanto a catalog.html.');
  if(typeof DecompressionStream==='undefined')throw new Error('Il browser non supporta la decompressione gzip nativa. Usa una versione recente di Chrome, Edge, Firefox o Safari.');
  const binary=atob(encoded);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const text=await new Response(stream).text();
  return JSON.parse(text);
}
(async()=>{
try{
const DATA=await loadCatalogData();
const state={query:'',year:'',directory:'',runtime:'',tags:[],sort:'date_desc',favoritesOnly:false,dupsOnly:false,rendered:0,batch:60,filtered:[]};
const $=id=>document.getElementById(id);
const grid=$('grid'),loader=$('loader'),empty=$('empty'),search=$('search');
const favorites=new Set(JSON.parse(localStorage.getItem('catalogFavorites')||'[]'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmtRuntime=n=>n?`${n} min`:'';
function itemDirs(i){return (i.files&&i.files.length?i.files:[i]).map(f=>f.directory).filter(Boolean)}
function uniqueValues(key){if(key==='directory'){const out=new Set();DATA.forEach(i=>itemDirs(i).forEach(d=>out.add(d)));return [...out].sort((a,b)=>String(a).localeCompare(String(b),'it',{numeric:true}))}const out=new Set();DATA.forEach(i=>{const v=i[key];Array.isArray(v)?v.forEach(x=>x&&out.add(x)):v&&out.add(v)});return [...out].sort((a,b)=>String(a).localeCompare(String(b),'it',{numeric:true}))}
function fillSelect(id,values,descending=false){const el=$(id);const current=el.value;values.sort((a,b)=>descending?Number(b)-Number(a):String(a).localeCompare(String(b),'it',{numeric:true})).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)});el.value=current}
fillSelect('yearFilter',uniqueValues('year').filter(Boolean),true);fillSelect('directoryFilter',uniqueValues('directory'));
function updateFilterBadge(){const count=['year','directory','runtime'].filter(k=>String(state[k]).trim()).length+state.tags.length;$('activeFilters').textContent=count}
function parseSearchQuery(value){
  const positive=[];
  const negative=[];
  const tokens=value.toLocaleLowerCase('it').trim().split(/\s+/).filter(Boolean);
  for(const token of tokens){
    if(token.startsWith('-')&&token.length>1)negative.push(token.slice(1));
    else positive.push(token);
  }
  return {positive,negative};
}
const PRESETS={NOSUB:{exclude:['subita','dualsub','engsub','multisub']},millennium:{min:2010},modern:{min:1990,max:2009},eighties:{min:1980,max:1989},goldies:{min:1960,max:1979},classics:{min:1940,max:1959},oldies:{max:1939}};
function presetMatches(p,i){if(p.exclude)return !p.exclude.some(t=>i.search.includes(t));const y=i.year;return (p.min===undefined||y>=p.min)&&(p.max===undefined||y<=p.max)}
function buildQuery(){state.query=search.value.toLocaleLowerCase('it').trim()}
function filterData(){const {positive,negative}=parseSearchQuery(state.query);let arr=DATA.filter(i=>{if(state.dupsOnly)return i.files&&i.files.length>1;if(positive.some(term=>!i.search.includes(term)))return false;if(negative.some(term=>i.search.includes(term)))return false;if(state.year&&String(i.year)!==state.year)return false;if(state.tags.some(tag=>!presetMatches(PRESETS[tag],i)))return false;if(state.directory&&!itemDirs(i).includes(state.directory))return false;if(state.runtime&&(!i.runtime||i.runtime>Number(state.runtime)))return false;if(state.favoritesOnly&&!favorites.has(i.id))return false;return true});
if(state.sort==='title_asc')arr.sort((a,b)=>a.title.localeCompare(b.title,'it'));else if(state.sort==='title_desc')arr.sort((a,b)=>b.title.localeCompare(a.title,'it'));else if(state.sort==='year_desc')arr.sort((a,b)=>b.year-a.year||a.title.localeCompare(b.title,'it'));else if(state.sort==='year_asc')arr.sort((a,b)=>a.year-b.year||a.title.localeCompare(b.title,'it'));else if(state.sort==='runtime_asc')arr.sort((a,b)=>(a.runtime||9999)-(b.runtime||9999));else if(state.sort==='random')arr.sort(()=>Math.random()-.5);else arr.sort((a,b)=>b.timestamp-a.timestamp);
state.filtered=arr;state.rendered=0;grid.innerHTML='';empty.classList.toggle('show',arr.length===0);$('resultsCount').textContent=`${arr.length} ${arr.length===1?'titolo':'titoli'}`;updateFilterBadge();renderNext()}
function cardHtml(i){const sub=[i.year||'',fmtRuntime(i.runtime)].filter(Boolean).join(' · ');const personalBadges=(i.personalTags||[]).map(tag=>`<span class="personal-badge">${esc(tag)}</span>`).join('');return `<article class="card" tabindex="0" data-id="${esc(i.id)}"><div class="poster-wrap${(i.files&&i.files.length>1)?' has-dup':''}">${i.poster?`<img class="poster" src="${esc(i.poster)}" alt="Locandina di ${esc(i.title)}" loading="lazy">`:`<div class="poster-placeholder"><span>${esc(i.title)}</span></div>`}${i.preview?`<span class="preview-stamp" aria-hidden="true">©</span>`:''}${personalBadges?`<div class="personal-badges">${personalBadges}</div>`:''}<button class="favorite-btn ${favorites.has(i.id)?'active':''}" data-fav="${esc(i.id)}" aria-label="Preferito" aria-pressed="${favorites.has(i.id)?'true':'false'}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14 2 9.27l6.91-1.01z"></path></svg></button>${i.rating?`<div class="rating-badge"><span>★</span>${i.rating.toFixed(1)}</div>`:''}<div class="poster-overlay"><div class="info-card"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 8h10M7 12h6M7 16h4"></path><circle cx="17" cy="15" r="2.5"></circle><path d="M17 13.8v2.4"></path></svg><span>Dettagli</span></div></div></div><h3 class="card-title">${esc(i.title)}</h3><p class="card-sub">${esc(sub)}</p></article>`}
function renderNext(){if(state.rendered>=state.filtered.length){loader.textContent=state.filtered.length?'Fine catalogo':'';return}const end=Math.min(state.rendered+state.batch,state.filtered.length);const chunk=state.filtered.slice(state.rendered,end);grid.insertAdjacentHTML('beforeend',chunk.map(cardHtml).join(''));state.rendered=end;loader.textContent=state.rendered<state.filtered.length?'Scorri per caricare altri titoli':'';grid.querySelectorAll('img.poster:not([data-bound])').forEach(img=>{img.dataset.bound='1';if(img.complete)img.classList.add('loaded');else img.addEventListener('load',()=>img.classList.add('loaded'),{once:true});img.addEventListener('error',()=>{img.remove();},{once:true})})}
function toggleFavorite(id,btn){favorites.has(id)?favorites.delete(id):favorites.add(id);const active=favorites.has(id);localStorage.setItem('catalogFavorites',JSON.stringify([...favorites]));btn?.classList.toggle('active',active);btn?.setAttribute('aria-pressed',active?'true':'false');toast(active?'Aggiunto ai preferiti':'Rimosso dai preferiti');if(state.favoritesOnly)filterData()}
function externalLinks(i){const id=i.tmdbId,iid=i.imdbId;if(/^tt\d+$/i.test(id||''))return `<div class="external-links"><a class="external-link" href="https://www.imdb.com/title/${encodeURIComponent(id)}/" target="_blank" rel="noopener noreferrer" aria-label="Apri su IMDb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>IMDB</a></div>`;let out=(id||iid)?`<div class="external-links">`:'';if(id)out+=`<a class="external-link" href="https://www.themoviedb.org/movie/${encodeURIComponent(id)}" target="_blank" rel="noopener noreferrer" aria-label="Apri su TMDB"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>TMDB</a>`;if(id)out+=`<a class="external-link" href="https://letterboxd.com/tmdb/${encodeURIComponent(id)}/" target="_blank" rel="noopener noreferrer" aria-label="Apri su Letterboxd"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/></svg>Letterboxd</a>`;if(iid)out+=`<a class="external-link" href="https://www.imdb.com/title/${encodeURIComponent(iid)}/" target="_blank" rel="noopener noreferrer" aria-label="Apri su IMDb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>IMDb</a>`;return out||''}
function openModal(id){const i=DATA.find(x=>x.id===id);if(!i)return;state.modalIndex=state.filtered.findIndex(x=>x.id===id);const poster=i.poster||'';const dup=i.files&&i.files.length>1;$('modalBg').style.backgroundImage=poster?`url("${poster.replace(/"/g,'%22')}")`:'none';$('modalContent').innerHTML=`${poster?`<div class="modal-poster-frame${dup?' has-dup':''}"><img class="modal-poster" src="${esc(poster)}" alt="">${i.preview?`<span class="preview-stamp" aria-hidden="true">©</span>`:''}</div>`:`<div class="modal-poster-frame${dup?' has-dup':''}"><div class="modal-poster poster-placeholder"><span>${esc(i.title)}</span></div>${i.preview?`<span class="preview-stamp" aria-hidden="true">©</span>`:''}</div>`}<section class="modal-info"><h2 class="modal-title">${esc(i.title)}</h2>${i.originalTitle&&i.originalTitle!==i.title?`<p class="modal-original">${esc(i.originalTitle)}</p>`:''}<div class="meta-row">${i.rating?`<span class="rating-large">★ ${i.rating.toFixed(1)}</span>`:''}${i.year?`<span class="meta-dot">${i.year}</span>`:''}${i.runtime?`<span class="meta-dot">${fmtRuntime(i.runtime)}</span>`:''}${i.officialRating?`<span class="meta-dot">${esc(i.officialRating)}</span>`:''}</div>${i.genres.length?`<div class="chips">${i.genres.map(g=>`<span class="chip">${esc(g)}</span>`).join('')}</div>`:''}${i.overview?`<p class="overview">${esc(i.overview)}</p>`:'<p class="overview">Nessuna descrizione disponibile.</p>'}<div class="details-grid">${i.director?`<div class="detail"><h4>Regia</h4><p>${esc(i.director)}</p></div>`:''}${i.studios.length?`<div class="detail"><h4>Studio</h4><p>${esc(i.studios.join(', '))}</p></div>`:''}${i.cast.length?`<div class="detail"><h4>Cast</h4><p class="cast-list">${esc(i.cast.join(', '))}</p></div>`:''}${i.dateDisplay?`<div class="detail"><h4>Aggiunto</h4><p>${esc(i.dateDisplay)}</p></div>`:''}${i.tags.length?`<div class="detail"><h4>Tag</h4><p>${esc(i.tags.join(', '))}</p></div>`:''}</div>${externalLinks(i)}${i.files&&i.files.length?`<div class="files-block"><h4>File disponibili</h4>${i.files.map(f=>`<div class="file-row"><div class="file-head"><span class="file-name">${esc(f.fileName)}</span>${(f.personalTags||[]).map(t=>`<span class="personal-badge file-badge">${esc(t)}</span>`).join('')}</div><div class="file-path">${esc(f.path)}</div><div class="file-meta">${esc(f.dateDisplay||f.dateAdded||'')}${(f.tags&&f.tags.length)?` · ${esc(f.tags.join(', '))}`:''}</div></div>`).join('')}</div>`:i.path?`<div class="path-box">${esc(i.path)}</div>`:''}</section>`;$('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false');document.body.classList.add('modal-open')}
function navModal(delta){const len=state.filtered.length;if(len<2||state.modalIndex<0)return;state.modalIndex=(state.modalIndex+delta+len)%len;openModal(state.filtered[state.modalIndex].id)}
function closeModal(){$('modal').classList.remove('open');$('modal').setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}
let toastTimer;function toast(msg){clearTimeout(toastTimer);$('toast').textContent=msg;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
let debounceTimer;search.addEventListener('input',()=>{clearTimeout(debounceTimer);$('clearSearch').classList.toggle('show',search.value.length>0);debounceTimer=setTimeout(()=>{buildQuery();filterData()},180)});$('clearSearch').addEventListener('click',()=>{search.value='';buildQuery();$('clearSearch').classList.remove('show');filterData();search.focus()});
$('filtersToggle').addEventListener('click',()=>$('filterPanel').classList.toggle('open'));$('sort').addEventListener('change',e=>{state.sort=e.target.value;filterData()});$('favoritesOnly').addEventListener('click',e=>{state.favoritesOnly=!state.favoritesOnly;e.currentTarget.classList.toggle('active',state.favoritesOnly);filterData()});$('dupsOnly').addEventListener('click',e=>{state.dupsOnly=!state.dupsOnly;e.currentTarget.classList.toggle('active',state.dupsOnly);filterData()});
$('randomPick').addEventListener('click',()=>{if(!state.filtered.length){toast('Nessun titolo da cui scegliere');return}openModal(state.filtered[Math.floor(Math.random()*state.filtered.length)].id)});
[['yearFilter','year'],['directoryFilter','directory']].forEach(([id,key])=>$(id).addEventListener('change',e=>{state[key]=e.target.value;filterData()}));
$('tagFilter').addEventListener('change',()=>{state.tags=[...$('tagFilter').querySelectorAll('input:checked')].map(c=>c.dataset.tag);filterData()});
function setRuntimeFilter(value){state.runtime=value;$('runtimeFilter').value=value;filterData()}
$('runtimeFilter').addEventListener('input',e=>setRuntimeFilter(e.target.value));
function resetAllFilters(){search.value='';$('clearSearch').classList.remove('show');['yearFilter','directoryFilter','runtimeFilter'].forEach(id=>$(id).value='');$('tagFilter').querySelectorAll('input').forEach(c=>c.checked=false);$('sort').value='date_desc';Object.assign(state,{query:'',year:'',directory:'',runtime:'',tags:[],sort:'date_desc',favoritesOnly:false,dupsOnly:false});$('favoritesOnly').classList.remove('active');$('dupsOnly').classList.remove('active');filterData()}
$('resetFilters').addEventListener('click',resetAllFilters);
grid.addEventListener('click',e=>{const fav=e.target.closest('[data-fav]');if(fav){e.stopPropagation();toggleFavorite(fav.dataset.fav,fav);return}const card=e.target.closest('.card');if(card)openModal(card.dataset.id)});grid.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();openModal(e.target.dataset.id)}});
$('modalClose').addEventListener('click',closeModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&document.body.classList.contains('modal-open')){e.preventDefault();navModal(e.key==='ArrowRight'?1:-1);return}if(e.key==='Escape'){if(document.body.classList.contains('modal-open'))closeModal();else resetAllFilters()}if(e.key==='/'&&!document.body.classList.contains('modal-open')){e.preventDefault();search.focus()}});
window.addEventListener('scroll',()=>{if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-700)renderNext()},{passive:true});
filterData();
}catch(error){
  console.error(error);
  const loader=document.getElementById('loader');
  const empty=document.getElementById('empty');
  if(loader)loader.textContent='Errore caricamento catalogo: '+error.message;
  if(empty)empty.classList.remove('show');
}
})();
</script>
</body>
</html>
